<section class="elevator">
  <h2>Elevator Status</h2>

  @if (errorMessage()) {
    <p class="error" data-testid="error-message">{{ errorMessage() }}</p>
  }

  @if (status(); as currentStatus) {
    <ul data-testid="elevator-status">
      <li>Max weight allowed: {{ currentStatus.maxWeightAllowed }}</li>
      <li>Current weight: {{ currentStatus.currentWeight }}</li>
      <li>Max weight reached: {{ currentStatus.maxWeightAllowedReached }}</li>
    </ul>
  }

  <form (ngSubmit)="addEmployee()">
    <label>
      Name
      <input type="text" name="employeeName" [(ngModel)]="employeeName" data-testid="employee-name" />
    </label>
    <label>
      Weight
      <input type="number" name="employeeWeight" [(ngModel)]="employeeWeight" data-testid="employee-weight" />
    </label>
    <label>
      <input type="checkbox" name="isExecutive" [(ngModel)]="isExecutive" data-testid="employee-executive" />
      Is executive
    </label>

    <button type="submit" data-testid="in-user-button">In</button>
    <button type="button" (click)="removeEmployee()" data-testid="out-user-button">Out</button>
    <button type="button" (click)="refreshStatus()" data-testid="refresh-button">Refresh</button>
  </form>
</section>
